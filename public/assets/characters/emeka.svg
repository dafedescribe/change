<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-emeka" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b1616"/>
      <stop offset="100%" stop-color="#0e0404"/>
    </radialGradient>
    <linearGradient id="skin-emeka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c5336"/>
      <stop offset="100%" stop-color="#552c1a"/>
    </linearGradient>
    <linearGradient id="polo-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg-emeka)"/>
  <circle cx="200" cy="180" r="140" fill="#ef4444" opacity="0.08"/>

  <!-- Shoulders / Bright Red Polo Shirt -->
  <path d="M70 390 C90 310 130 270 200 270 C270 270 310 310 330 390 Z" fill="url(#polo-red)"/>
  <!-- Polo Collar -->
  <polygon points="160,270 200,305 240,270 220,270 200,285 180,270" fill="#991b1b"/>
  <!-- Gold chain necklace -->
  <path d="M175 272 Q200 295 225 272" stroke="#facc15" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Hand holding smartphone near chest -->
  <g transform="translate(85, 310) rotate(-15)">
    <rect x="0" y="0" width="36" height="65" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="4" y="8" width="28" height="48" rx="2" fill="#38bdf8" opacity="0.6"/>
    <!-- Gold wristwatch on cuff -->
    <rect x="-8" y="55" width="52" height="18" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  </g>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="65" rx="8" fill="url(#skin-emeka)"/>

  <!-- Head & Ears -->
  <ellipse cx="145" cy="175" rx="13" ry="20" fill="#6d3a22"/>
  <ellipse cx="255" cy="175" rx="13" ry="20" fill="#6d3a22"/>
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="url(#skin-emeka)"/>

  <!-- Haircut with shaved side parting line -->
  <path d="M145 155 C145 92 165 78 200 78 C235 78 255 92 255 155 C250 115 230 98 200 98 C170 98 150 115 145 155 Z" fill="#171216"/>
  <!-- Razor Part line -->
  <path d="M165 110 L185 96" stroke="#8c5336" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyebrows (street-smart, raised arched brow) -->
  <path d="M164 140 Q178 132 192 140" stroke="#1f140e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M208 142 Q222 136 236 141" stroke="#1f140e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Eyes with calculating look -->
  <ellipse cx="178" cy="155" rx="9" ry="6" fill="#ffffff"/>
  <circle cx="179" cy="155" r="4.5" fill="#1f140e"/>
  <circle cx="177" cy="153" r="1.5" fill="#ffffff"/>

  <ellipse cx="222" cy="156" rx="9" ry="6" fill="#ffffff"/>
  <circle cx="221" cy="156" r="4.5" fill="#1f140e"/>
  <circle cx="219" cy="154" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M200 156 L196 178 Q200 184 206 182" stroke="#452112" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Neat goatee & mustache -->
  <path d="M188 193 Q200 196 212 193" stroke="#171216" stroke-width="3" stroke-linecap="round"/>
  <path d="M185 204 Q200 216 215 204" stroke="#452112" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="200" cy="225" rx="8" ry="6" fill="#171216"/>

  <!-- Character Nameplate Badge -->
  <g transform="translate(20, 20)">
    <rect width="105" height="28" rx="8" fill="#000000aa" stroke="#ef4444" stroke-width="1.5"/>
    <text x="52" y="19" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="800" font-size="14">EMEKA</text>
  </g>
</svg>
