<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-folake" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d1527"/>
      <stop offset="100%" stop-color="#0a050d"/>
    </radialGradient>
    <linearGradient id="skin-folake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5438"/>
      <stop offset="100%" stop-color="#5a3120"/>
    </linearGradient>
    <linearGradient id="pink-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bead-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg-folake)"/>
  <circle cx="200" cy="180" r="140" fill="#f43f5e" opacity="0.08"/>

  <!-- Shoulders / Pink Top -->
  <path d="M70 390 C90 310 130 275 200 275 C270 275 310 310 330 390 Z" fill="url(#pink-top)"/>
  <path d="M165 275 Q200 310 235 275 Z" fill="url(#skin-folake)"/>

  <!-- Neck -->
  <rect x="175" y="215" width="50" height="70" rx="8" fill="url(#skin-folake)"/>

  <!-- Gold necklace -->
  <path d="M172 265 Q200 285 228 265" stroke="#facc15" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Head & Ears -->
  <ellipse cx="145" cy="180" rx="14" ry="22" fill="#6e3c27"/>
  <ellipse cx="255" cy="180" rx="14" ry="22" fill="#6e3c27"/>
  <circle cx="142" cy="190" r="10" stroke="#facc15" stroke-width="3" fill="none"/>
  <circle cx="258" cy="190" r="10" stroke="#facc15" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="175" rx="55" ry="65" fill="url(#skin-folake)"/>

  <!-- Braided Hair Foundation -->
  <path d="M135 170 C130 100 170 75 200 75 C230 75 270 100 265 170 C250 120 225 105 200 105 C175 105 150 120 135 170 Z" fill="#171216"/>

  <!-- Braids hanging down with beads -->
  <path d="M140 160 Q120 230 130 310" stroke="#171216" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M152 170 Q138 240 145 320" stroke="#171216" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M260 160 Q280 230 270 310" stroke="#171216" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M248 170 Q262 240 255 320" stroke="#171216" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Colorful Pink/Coral Beads -->
  <circle cx="127" cy="275" r="9" fill="url(#bead-grad)"/>
  <circle cx="129" cy="295" r="9" fill="#facc15"/>
  <circle cx="131" cy="315" r="9" fill="url(#bead-grad)"/>

  <circle cx="142" cy="285" r="8" fill="url(#bead-grad)"/>
  <circle cx="145" cy="305" r="8" fill="#38bdf8"/>
  <circle cx="147" cy="325" r="8" fill="url(#bead-grad)"/>

  <circle cx="273" cy="275" r="9" fill="url(#bead-grad)"/>
  <circle cx="271" cy="295" r="9" fill="#facc15"/>
  <circle cx="269" cy="315" r="9" fill="url(#bead-grad)"/>

  <circle cx="258" cy="285" r="8" fill="url(#bead-grad)"/>
  <circle cx="255" cy="305" r="8" fill="#38bdf8"/>
  <circle cx="253" cy="325" r="8" fill="url(#bead-grad)"/>

  <!-- Eyebrows -->
  <path d="M165 145 Q180 140 190 146" stroke="#26120b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M210 146 Q220 140 235 145" stroke="#26120b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes with lively sparkle -->
  <ellipse cx="178" cy="160" rx="9" ry="7" fill="#ffffff"/>
  <circle cx="179" cy="160" r="5" fill="#2d180f"/>
  <circle cx="177" cy="158" r="2" fill="#ffffff"/>

  <ellipse cx="222" cy="160" rx="9" ry="7" fill="#ffffff"/>
  <circle cx="221" cy="160" r="5" fill="#2d180f"/>
  <circle cx="219" cy="158" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M200 162 L196 182 Q200 188 206 186" stroke="#482515" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Warm, vibrant smile -->
  <path d="M182 205 Q200 226 218 205" stroke="#be123c" stroke-width="5" fill="#ffffff" stroke-linecap="round"/>
  <path d="M180 205 Q200 216 220 205" stroke="#e11d48" stroke-width="3" fill="none"/>

  <!-- Character Nameplate Badge -->
  <g transform="translate(20, 20)">
    <rect width="110" height="28" rx="8" fill="#000000aa" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="55" y="19" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-weight="800" font-size="14">FOLAKE</text>
  </g>
</svg>
