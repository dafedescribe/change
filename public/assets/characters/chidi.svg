<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-chidi" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10253f"/>
      <stop offset="100%" stop-color="#040d18"/>
    </radialGradient>
    <linearGradient id="skin-chidi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#804d32"/>
      <stop offset="100%" stop-color="#512d1c"/>
    </linearGradient>
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg-chidi)"/>
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.08"/>

  <!-- Shoulders / Business Collared Shirt -->
  <path d="M70 390 C90 310 130 270 200 270 C270 270 310 310 330 390 Z" fill="url(#shirt-blue)"/>
  <polygon points="170,270 200,320 230,270" fill="#ffffff" opacity="0.95"/>
  <polygon points="175,270 200,295 185,340 160,285" fill="#f0f9ff"/>
  <polygon points="225,270 200,295 215,340 240,285" fill="#e0f2fe"/>

  <!-- Tech Lanyard -->
  <path d="M165 270 L195 380" stroke="#f43f5e" stroke-width="6" fill="none"/>
  <path d="M235 270 L205 380" stroke="#f43f5e" stroke-width="6" fill="none"/>
  <!-- ID Badge -->
  <rect x="180" y="360" width="40" height="35" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="186" y="365" width="28" height="12" fill="#38bdf8"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="65" rx="8" fill="url(#skin-chidi)"/>

  <!-- Head & Ears -->
  <ellipse cx="145" cy="175" rx="13" ry="20" fill="#663c26"/>
  <ellipse cx="255" cy="175" rx="13" ry="20" fill="#663c26"/>
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="url(#skin-chidi)"/>

  <!-- Crisp Modern Fade Haircut -->
  <path d="M145 155 C145 95 165 80 200 80 C235 80 255 95 255 155 C250 115 230 100 200 100 C170 100 150 115 145 155 Z" fill="#111827"/>
  <path d="M142 165 L148 140 L160 130" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M258 165 L252 140 L240 130" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyebrows (focused, professional) -->
  <path d="M165 142 Q180 136 192 140" stroke="#1f140e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M208 140 Q220 136 235 142" stroke="#1f140e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="178" cy="155" rx="9" ry="6.5" fill="#ffffff"/>
  <circle cx="179" cy="155" r="4.5" fill="#1f140e"/>
  <circle cx="177" cy="153" r="1.5" fill="#ffffff"/>

  <ellipse cx="222" cy="155" rx="9" ry="6.5" fill="#ffffff"/>
  <circle cx="221" cy="155" r="4.5" fill="#1f140e"/>
  <circle cx="219" cy="153" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M200 156 L196 178 Q200 184 206 182" stroke="#3e2012" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Smart confident mouth & goatee line -->
  <path d="M185 204 Q200 214 215 204" stroke="#3e2012" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M192 222 Q200 225 208 222" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Character Nameplate Badge -->
  <g transform="translate(20, 20)">
    <rect width="100" height="28" rx="8" fill="#000000aa" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="19" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-weight="800" font-size="14">CHIDI</text>
  </g>
</svg>
